<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snaps Gallery</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="appbar tall">
    <div class="bar-row">
      <svg class="logo" viewBox="0 0 48 48" width="32" height="32" aria-hidden="true">
        <rect width="48" height="48" rx="11" fill="#fff"/>
        <path d="M14 20v-4a2 2 0 012-2h4M28 14h4a2 2 0 012 2v4M34 28v4a2 2 0 01-2 2h-4M20 34h-4a2 2 0 01-2-2v-4" style="stroke:var(--a1)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="24" cy="24" r="4.6" style="fill:var(--a1)"/>
      </svg>
      <h1>Snaps</h1>
      <span class="count" id="count">Gallery</span>
      <div class="spacer"></div>
      <button class="btn" id="btnOpen"><span data-icon="image"></span>Open image</button>
      <button class="btn" id="btnClear"><span data-icon="trash"></span>Clear all</button>
      <input type="file" id="fileIn" accept="image/*" hidden>
    </div>
    <nav class="tabs" id="chips" role="tablist"></nav>
  </header>

  <div class="wrap">
    <section class="info-card" id="welcome" hidden>
      <span class="info-ico" data-icon="info"></span>
      <div class="wtxt">
        <h2>Welcome to Snaps</h2>
        <p>Pin the extension (puzzle icon, then pin), then try a shortcut on any website.</p>
        <div class="tips">
          <div><span data-icon="area"></span><b>Select area</b><span><kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>A</kbd></span></div>
          <div><span data-icon="visible"></span><b>Visible part</b><span><kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>V</kbd></span></div>
          <div><span data-icon="full"></span><b>Full page</b><span><kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>F</kbd></span></div>
        </div>
      </div>
      <button class="btn icon" id="closeWelcome" title="Dismiss" aria-label="Dismiss"></button>
    </section>

    <main id="main"></main>

    <div class="empty" id="empty" hidden>
      <div class="badge" data-icon="gallery"></div>
      <h2>No captures yet</h2>
      <p>Press <kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>A</kbd> on any page to grab your first screenshot.</p>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toastText"></span></div>
  <script src="../lib/icons.js"></script>
  <script src="../lib/ripple.js"></script>
  <script type="module" src="gallery.js"></script>
</body>
</html>
